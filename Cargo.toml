[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/platform",
    "crates/protocol",
    "crates/onnx",
    "crates/kodama",
    "crates/vad",
    "crates/asr-server",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
futures-util = "0.3"
sherpa-onnx = { version = "1.13.5", default-features = false, features = ["static"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "alternative-backend"] }
ndarray = "0.16"

# 窓を中身に合わせて伸縮させるために floem を fork している。
# 0.2.0 には窓を後から拡縮する手段が無く、作るときの大きさが全てだった。
# 上流の最新には入っているが、0.2.0 からの差が大きく(45 箇所が壊れる)、
# 見た目の回帰を伴う移行になるため、0.2.0 に set_window_size だけを足した。
[patch.crates-io]
floem = { git = "https://github.com/kizuna-intelligence/floem", branch = "feat/set-window-size" }
